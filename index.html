<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claim Your Reward</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f5f6f8;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    position: relative;
    overflow: hidden;
  }

  #particle-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 1;
    pointer-events: none;
  }

  .page {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    max-width: 500px;
    max-height: 100%;
  }

  /* Social proof toast */
  .toast {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #000000;
    border: 1px solid #000000;
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 600;
    color: #ffffff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    margin-bottom: 10px;
    animation: fadeSwap 4s infinite;
    flex-shrink: 0;
  }

  .toast .spark {
    font-size: 14px;
    color: #c8102e;
  }

  @keyframes fadeSwap {
    0%   { opacity: 0; transform: translateY(4px); }
    10%  { opacity: 1; transform: translateY(0); }
    85%  { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-4px); }
  }

  /* Main card */
  .card {
    position: relative;
    width: 100%;
    max-width: 500px;
    max-height: 100%;
    overflow-y: auto;
    background: #ffffff;
    border: 1px solid #e3e6ea;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    padding: 16px 18px;
  }

  .gift-image {
    width: 100%;
    border-radius: 12px;
    overflow: hidden;
  }

  .gift-image img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 12px;
  }

  .reward-amount {
    text-align: center;
    margin-top: 10px;
  }

  .reward-amount .amount {
    font-family: "Arial Narrow", "Helvetica Neue Condensed", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 38px;
    font-weight: 900;
    letter-spacing: -1px;
    color: #000000;
    line-height: 1;
  }

  .reward-amount .label {
    font-family: "Arial Narrow", "Helvetica Neue Condensed", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #6b6f76;
    margin-top: 4px;
  }

  /* Steps */
  .steps {
    margin-top: 12px;
    background: rgba(0, 0, 0, 0.04);
    border-radius: 12px;
    padding: 4px 14px;
  }

  .step {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 7px 0;
  }

  .step:not(:last-child) {
    border-bottom: 1px solid rgba(0,0,0,0.04);
  }

  .step-badge {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #c8102e;
    color: #ffffff;
    font-weight: 700;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .step-text {
    font-size: 13px;
    color: #2c2c2c;
    line-height: 1.25;
  }

  /* CTA */
  .cta {
    display: block;
    width: 100%;
    text-align: center;
    margin-top: 12px;
    padding: 13px;
    background: #c8102e;
    color: #ffffff;
    text-decoration: none;
    font-weight: 700;
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-radius: 12px;
    transition: background-color 0.15s ease;
  }

  .cta:hover {
    background-color: #000000;
  }

  .disclaimer {
    text-align: center;
    margin-top: 8px;
    font-size: 10px;
    color: #9a9fa6;
  }

  @media (max-height: 700px) {
    .reward-amount .amount { font-size: 32px; }
    .step { padding: 5px 0; }
    .toast { display: none; }
  }

  @media (max-width: 360px) {
    .reward-amount .amount {
      font-size: 34px;
    }
  }
</style>
</head>
<body>

  <canvas id="particle-canvas"></canvas>

  <div class="page">
    <div class="toast" id="toast">
      <span class="spark">✨</span>
      <span id="toast-text">Sarah M. claimed $500!</span>
    </div>

    <div class="card">
      <div class="gift-image">
        <img src="Foot-Locker.jpg" alt="Gift Card">
      </div>

      <div class="reward-amount">
        <div class="amount">$500</div>
        <div class="label">FootLocker Gift Card</div>
      </div>

      <div class="steps">
        <div class="step">
          <div class="step-badge">1</div>
          <div class="step-text">Click The Button Below</div>
        </div>
        <div class="step">
          <div class="step-badge">2</div>
          <div class="step-text">Enter Your Email & Basic Info</div>
        </div>
        <div class="step">
          <div class="step-badge">3</div>
          <div class="step-text">Complete Required Offers</div>
        </div>
        <div class="step">
          <div class="step-badge">4</div>
          <div class="step-text">Claim Your Reward</div>
        </div>
      </div>

      <a href="https://trksy.org/aff_c?offer_id=275&aff_id=173683" class="cta">Claim Your $500 →</a>

      <div class="disclaimer">(Offer not sponsored/endorsed by this brand)</div>
    </div>
  </div>

  <script>
    const names = [
      "Sarah M. claimed $500!",
      "James K. claimed $500!",
      "Maria L. claimed $500!",
      "David R. claimed $500!",
      "Emily T. claimed $500!",
      "Michael B. claimed $500!"
    ];

    let index = 0;
    const textEl = document.getElementById("toast-text");
    const toastEl = document.getElementById("toast");

    setInterval(() => {
      index = (index + 1) % names.length;
      textEl.textContent = names[index];
      toastEl.style.animation = "none";
      requestAnimationFrame(() => {
        toastEl.style.animation = "fadeSwap 4s infinite";
      });
    }, 4000);

    const canvas = document.getElementById("particle-canvas");
    const ctx = canvas.getContext("2d");
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function createParticles() {
      const count = 32;
      particles = [];
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 0.2 + Math.random() * 0.3;
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: 2 + Math.random() * 8,
          opacity: 0.08 + Math.random() * 0.32,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed
        });
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (const p of particles) {
        p.x += p.vx;
        p.y += p.vy;

        if (p.x < -p.radius) p.x = canvas.width + p.radius;
        if (p.x > canvas.width + p.radius) p.x = -p.radius;
        if (p.y < -p.radius) p.y = canvas.height + p.radius;
        if (p.y > canvas.height + p.radius) p.y = -p.radius;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(200, 16, 46, ${p.opacity})`;
        ctx.fill();
      }

      requestAnimationFrame(animateParticles);
    }

    resizeCanvas();
    createParticles();
    animateParticles();

    window.addEventListener("resize", () => {
      resizeCanvas();
      createParticles();
    });
  </script>

</body>
</html>
